<!doctype html>
<html><head><meta charset="utf-8">
<!-- Balcony beat (6s). Entry: full-screen photo (as if footage) pulls into the card.
     Exit: tags fade so the last frame equals location_v3's first frame (card + headline + line + "3 ft" pill, camera scale 1.02). -->
<style>
:root{--blue:#1f5fff;--cyan:#22b8f0;
  --out:cubic-bezier(.16,1,.3,1);--in:cubic-bezier(.7,0,.84,0);--io:cubic-bezier(.65,0,.35,1);--pop:cubic-bezier(.34,1.56,.64,1)}
@property --n{syntax:'<integer>';inherits:true;initial-value:0}
*{margin:0;box-sizing:border-box}
body{width:1080px;height:1920px;overflow:hidden;font-family:"Inter Display",Inter,sans-serif;
  background:radial-gradient(ellipse at 50% 40%,#f4f6f9 0%,#e6e9ee 60%,#cfd4dc 100%)}
.grain{position:absolute;inset:0;z-index:60;pointer-events:none;
  background-image:radial-gradient(rgba(0,0,0,.09) 1px,transparent 1.5px);background-size:5px 5px;mix-blend-mode:multiply}
.abs{position:absolute}
.lite{font-weight:300;letter-spacing:-.03em;color:#4a4f59}
.key{font-weight:800;letter-spacing:-.06em;background:linear-gradient(90deg,var(--blue),var(--cyan));-webkit-background-clip:text;color:transparent}

/* camera: slow push that ends at scale 1.02 = where the location beat's scene starts */
#drift{position:absolute;inset:0;transform-origin:540px 960px;animation:drift 4.8s var(--io) 1.2s both}
@keyframes drift{from{transform:scale(.985)}to{transform:scale(1.02)}}

/* ---------- photo: full screen -> card ---------- */
.card{position:absolute;overflow:hidden;animation:toCard 1.3s linear both}
@keyframes toCard{
  0%{left:-40px;top:-40px;width:1160px;height:2000px;border-radius:0;box-shadow:0 0 0 rgba(20,30,60,0);animation-timing-function:var(--out)}
  12%{left:-70px;top:-80px;width:1220px;height:2080px;border-radius:0;animation-timing-function:var(--io)}   /* anticipation: pushes in */
  70%{left:184px;top:497px;width:712px;height:890px;border-radius:40px;box-shadow:0 50px 90px rgba(20,30,60,.25);animation-timing-function:var(--io)} /* overshoot */
  100%{left:170px;top:480px;width:740px;height:925px;border-radius:40px;box-shadow:0 50px 90px rgba(20,30,60,.25)}}
.photo{position:absolute;inset:-6px;background:url(assets/balcony.jpg) center/cover;animation:focus 1.0s var(--out) .1s both}
@keyframes focus{from{filter:blur(14px) saturate(.9)}to{filter:blur(1.6px) saturate(.9)}}

/* ---------- headline ---------- */
@keyframes upIn{from{opacity:0;transform:translateY(40px);filter:blur(16px)}to{opacity:1;transform:none;filter:none}}
.w1{display:inline-block;animation:rise36 .45s var(--txt) .75s both, reveal .2s var(--rev) .75s both}
.w2{display:inline-block;animation:rise36 .45s var(--txt) .92s both, reveal .2s var(--rev) .92s both}
.bal{display:inline-block;animation:rise36 .75s var(--key) 1.09s both, reveal .3s var(--rev) 1.09s both, glow 1.1s var(--io) 4.4s forwards}
@keyframes punch{
  0%{opacity:0;transform:translateY(60px) scale(.7);filter:blur(20px);animation-timing-function:var(--out)}
  10%{opacity:.4;transform:translateY(64px) scale(.68);filter:blur(16px);animation-timing-function:var(--out)}
  45%{opacity:1;transform:translateY(-8px) scale(1.06,.94);filter:blur(0);animation-timing-function:var(--io)}
  72%{transform:translateY(2px) scale(.98,1.02);animation-timing-function:var(--io)}
  100%{opacity:1;transform:none}}
@keyframes glow{0%,100%{filter:drop-shadow(0 0 0 rgba(31,95,255,0))}45%{filter:drop-shadow(0 0 26px rgba(31,95,255,.5))}}

/* ---------- 3 ft measurement ---------- */
svg *{transform-box:fill-box;transform-origin:center}
.ln{animation:lineDraw .55s var(--io) 1.35s both}
@keyframes lineDraw{from{transform:scaleX(0)}to{transform:none}}
.tk{animation:tick .4s linear both}
@keyframes tick{0%{transform:scaleY(0);animation-timing-function:var(--out)}60%{transform:scaleY(1.3)}100%{transform:none}}
.pill{position:absolute;left:445px;top:1074px;width:150px;height:92px;border-radius:46px;background:var(--blue);color:#fff;
  display:flex;align-items:center;justify-content:center;font-weight:800;font-size:50px;letter-spacing:-.03em;z-index:6;
  animation:pillPop .55s linear 1.72s both, pulse .5s linear 3.8s forwards}
@keyframes pillPop{0%{transform:scale(0);animation-timing-function:var(--out)}
  50%{transform:scale(1.15,.86);animation-timing-function:var(--io)}78%{transform:scale(.96,1.04);animation-timing-function:var(--io)}100%{transform:none}}
@keyframes pulse{0%{transform:none;animation-timing-function:var(--out)}40%{transform:scale(1.1);animation-timing-function:var(--io)}100%{transform:none}}

/* ---------- tags inside the card; they leave before the cut ---------- */
.tag{position:absolute;padding:14px 26px;border-radius:999px;background:rgba(255,255,255,.94);font-weight:600;font-size:34px;letter-spacing:-.03em;color:#4a4f59;
  box-shadow:0 10px 30px rgba(20,30,60,.15);white-space:nowrap}
.tag b{color:var(--blue);font-weight:800}
@keyframes fromL{from{opacity:0;transform:translateX(-50px);filter:blur(10px)}to{opacity:1;transform:none;filter:none}}
@keyframes fromR{from{opacity:0;transform:translateX(50px);filter:blur(10px)}to{opacity:1;transform:none;filter:none}}
@keyframes tagOut{to{opacity:0;transform:scale(.92);filter:blur(8px)}}
.t1{left:200px;top:510px;animation:fromL .6s var(--out) 2.3s both, tagOut .3s var(--in) 5.35s forwards}
.t2{right:200px;top:1300px;animation:fromR .6s var(--out) 2.9s both, tagOut .3s var(--in) 5.42s forwards}
.cnt::after{counter-reset:n var(--n);content:counter(n)}
.cnt{animation:c700 .7s var(--out) 2.95s both}
@keyframes c700{from{--n:0}to{--n:700}}

.br{position:absolute;width:44px;height:44px;border-color:#2a2d33;border-style:solid;border-width:0;z-index:55}

/* ---- text motion, measured from the reference ----
   words: rise 36px, 0.45s on --txt; blur/opacity clear first (0.2s, --rev).
   key word: 0.75s on --key, no overshoot/squash; then .kw breathes +2.5% through the hold. */
:root{--txt:cubic-bezier(.2,.3,0,.8);--key:cubic-bezier(.3,.65,.45,.85);--rev:cubic-bezier(.2,.7,.3,1)}
@keyframes rise36{from{transform:translateY(36px)}to{transform:none}}
@keyframes reveal{from{opacity:0;filter:blur(16px)}to{opacity:1;filter:blur(0)}}
@keyframes breathe{from{transform:scale(1)}to{transform:scale(1.025)}}
.kw{display:inline-block;transform-origin:50% 60%;animation:breathe var(--bl) var(--io) var(--bd) both}
</style></head><body>
<div id="drift">
  <div class="abs" style="top:270px;left:0;width:100%;text-align:center;white-space:nowrap;font-size:60px">
    <span class="lite w1">sabse</span> <span class="lite w2">beautiful</span> <span class="kw" style="--bd:1.84s;--bl:3.5s"><span class="key bal" style="font-size:130px">balcony</span></span></div>
  <div class="card"><div class="photo"></div>
    <!-- line sits at the same spot inside the card as in the location beat: x 150–590, y 640 -->
    <svg class="abs" style="left:0;top:0" width="740" height="925"><g stroke="#fff" stroke-width="5">
      <line class="ln" x1="150" y1="640" x2="590" y2="640"/>
      <line class="tk" style="animation-delay:1.8s" x1="150" y1="620" x2="150" y2="660"/>
      <line class="tk" style="animation-delay:1.85s" x1="590" y1="620" x2="590" y2="660"/></g></svg>
  </div>
  <div class="tag t1">khadi + <b>mountain view</b></div>
  <div class="tag t2">lagbhag <b><span class="cnt"></span> sq ft</b></div>
</div>
<!-- pill is outside the camera, exactly where the location beat's carried pill starts -->
<div class="pill">3 ft</div>

<div class="br" style="left:90px;top:230px;border-left-width:4px;border-top-width:4px"></div>
<div class="br" style="left:946px;top:230px;border-right-width:4px;border-top-width:4px"></div>
<div class="br" style="left:90px;top:1396px;border-left-width:4px;border-bottom-width:4px"></div>
<div class="br" style="left:946px;top:1396px;border-right-width:4px;border-bottom-width:4px"></div>
<div class="grain"></div>
</body></html>
