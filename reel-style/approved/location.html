<!doctype html>
<html><head><meta charset="utf-8">
<!-- Location beat v3 (6s). v2 + camera follows the pill, ~40% faster build, big times, icons instead of names.
     Timing cues (s, no sound until the sound guide): whip .30 · punch .72 · land .93 · ticks 1.10/1.15/1.95/2.00 · plucks 1.50/2.45 · pulses 3.10/3.90 · riser 4.6 → hit 5.55 -->
<style>
:root{--blue:#1f5fff;--cyan:#22b8f0;
  --out:cubic-bezier(.16,1,.3,1);--in:cubic-bezier(.7,0,.84,0);--io:cubic-bezier(.65,0,.35,1);--pop:cubic-bezier(.34,1.56,.64,1)}
*{margin:0;box-sizing:border-box}
body{width:1080px;height:1920px;overflow:hidden;font-family:"Inter Display",Inter,sans-serif;
  background:radial-gradient(ellipse at 50% 40%,#f4f6f9 0%,#e6e9ee 60%,#cfd4dc 100%)}
.grain{position:absolute;inset:0;z-index:60;pointer-events:none;
  background-image:radial-gradient(rgba(0,0,0,.09) 1px,transparent 1.5px);background-size:5px 5px;mix-blend-mode:multiply}
.abs{position:absolute}
.lite{font-weight:300;letter-spacing:-.03em;color:#4a4f59}
.key{font-weight:800;letter-spacing:-.06em;background:linear-gradient(90deg,var(--blue),var(--cyan));-webkit-background-clip:text;color:transparent}
.card{border-radius:40px;overflow:hidden;box-shadow:0 50px 90px rgba(20,30,60,.25)}
svg *{transform-box:fill-box;transform-origin:center}
svg .orbit{transform-box:view-box;transform-origin:540px 520px}

/* ---------- camera ---------- */
#cam{position:absolute;inset:0;transform-origin:540px 960px;animation:camOut .7s 5.3s both}
@keyframes camOut{0%{transform:none;animation-timing-function:var(--out)}
  28%{transform:scale(.965);animation-timing-function:var(--in)}100%{transform:scale(11)}}
/* follow the pill during its flight so the frame never empties */
#follow{position:absolute;inset:0;transform-origin:540px 960px;animation:follow 1.15s linear both}
@keyframes follow{0%,28%{transform:none;animation-timing-function:var(--io)}
  50%{transform:translate(190px,-70px) scale(1.2);animation-timing-function:var(--out)}
  92%,100%{transform:none}}
#drift{position:absolute;inset:0;transform-origin:540px 960px;animation:drift 4.7s var(--io) .6s both}
@keyframes drift{from{transform:scale(1)}to{transform:scale(1.045)}}

/* ---------- scene A (previous beat): anticipation, then whip left ---------- */
#sceneA{position:absolute;inset:0;animation:whipA .62s linear both}
@keyframes whipA{
  0%{transform:perspective(1600px) translateX(0) scale(1.02);animation-timing-function:var(--io)}
  32%{transform:perspective(1600px) translateX(0) scale(1.025);animation-timing-function:var(--out)}
  52%{transform:perspective(1600px) translateX(34px) scale(1.01) rotateY(-4deg);animation-timing-function:var(--in)}
  100%{transform:perspective(1600px) translateX(-1400px) scale(.94) rotateY(38deg)}}

/* ---------- carried element: "3 ft" pill -> disc ---------- */
.flyx{position:absolute;left:540px;top:960px;animation:flyx 1.0s linear both}
.flyy{animation:flyy 1.0s linear both}
@keyframes flyx{
  0%{transform:translateX(-20px)} 20%{transform:translateX(-20px);animation-timing-function:var(--out)}
  32%{transform:translateX(12px);animation-timing-function:var(--in)}
  52%{transform:translateX(-300px);animation-timing-function:var(--out)}
  95%,100%{transform:translateX(0)}}
@keyframes flyy{
  0%,32%{transform:translateY(160px);animation-timing-function:var(--io)}
  62%{transform:translateY(225px);animation-timing-function:var(--io)}
  95%,100%{transform:translateY(0)}}
.disc{position:absolute;left:0;top:0;background:var(--blue);overflow:hidden;color:#fff;animation:morph 1.35s linear both}
@keyframes morph{
  0%,40%{width:150px;height:92px;border-radius:46px;transform:translate(-50%,-50%);animation-timing-function:var(--io)}
  52%{width:166px;height:84px;border-radius:42px;transform:translate(-50%,-50%) scaleX(1.12);animation-timing-function:var(--io)}
  70%{width:240px;height:240px;border-radius:120px;transform:translate(-50%,-50%) scale(1);animation-timing-function:var(--out)}
  77%{width:240px;height:240px;border-radius:120px;transform:translate(-50%,-50%) scale(1.14,.86);animation-timing-function:var(--out)}
  88%{width:240px;height:240px;border-radius:120px;transform:translate(-50%,-50%) scale(.96,1.04);animation-timing-function:var(--io)}
  100%{width:240px;height:240px;border-radius:120px;transform:translate(-50%,-50%)}}
.ft{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:50px;letter-spacing:-.03em;
  animation:fadeOut .2s var(--io) .5s both}
@keyframes fadeOut{to{opacity:0;transform:scale(.6)}}
.tw{position:absolute;bottom:58px;width:34px;background:#fff;border-radius:5px}
.tw1{left:78px;height:120px;animation:rise .6s var(--pop) 1.0s both, clear .3s var(--in) 5.45s forwards}
.tw2{left:126px;height:146px;animation:rise .6s var(--pop) 1.07s both, clear .3s var(--in) 5.5s forwards}
@keyframes rise{from{transform:translateY(180px) scaleY(.8)}to{transform:none}}
@keyframes clear{to{opacity:0}}

/* ---------- headline ---------- */
@keyframes wordIn{from{opacity:0;transform:translateX(90px);filter:blur(16px)}to{opacity:1;transform:none;filter:none}}
.w1{display:inline-block;animation:rise36 .45s var(--txt) .45s both, reveal .2s var(--rev) .45s both}
.w2{display:inline-block;animation:rise36 .45s var(--txt) .62s both, reveal .2s var(--rev) .62s both}
.paas{display:inline-block;animation:rise36 .75s var(--key) .79s both, reveal .3s var(--rev) .79s both, glow 1s var(--io) 1.6s forwards}
@keyframes paas{
  0%{opacity:0;transform:translateX(140px) scale(.7);filter:blur(20px);animation-timing-function:var(--out)}
  40%{opacity:1;transform:translateX(-10px) scale(1.09,.93);filter:blur(0);animation-timing-function:var(--io)}
  68%{transform:translateX(3px) scale(.97,1.03);animation-timing-function:var(--io)}
  100%{opacity:1;transform:none}}
@keyframes glow{0%,100%{filter:drop-shadow(0 0 0 rgba(31,95,255,0))}45%{filter:drop-shadow(0 0 26px rgba(31,95,255,.5))}}

/* ---------- rings ---------- */
.ring{fill:none;stroke:#2a2d33;stroke-width:3;stroke-dasharray:1}
.r1{stroke:#1f5fff;stroke-width:4;animation:draw .55s var(--io) 1.0s both}
.r2{animation:draw2 .6s var(--io) 1.9s both}
@keyframes draw{from{stroke-dashoffset:1;transform:rotate(-90deg) scale(.55)}to{stroke-dashoffset:0;transform:rotate(-90deg) scale(1)}}
@keyframes draw2{from{stroke-dashoffset:1;transform:rotate(90deg) scale(.8)}to{stroke-dashoffset:0;transform:rotate(90deg) scale(1)}}

/* ---------- icon badges ride the rings; icons counter-rotate to stay upright ---------- */
@keyframes dotPop{0%{transform:scale(0);animation-timing-function:var(--out)}55%{transform:scale(1.25,.8);animation-timing-function:var(--io)}
  80%{transform:scale(.92,1.08)}100%{transform:none}}
@keyframes pulse{0%{transform:none;animation-timing-function:var(--out)}35%{transform:scale(1.25,1.15);animation-timing-function:var(--io)}70%{transform:scale(.95,1.03)}100%{transform:none}}
.ride{animation-duration:.45s;animation-timing-function:var(--io);animation-fill-mode:both}
@keyframes rot-45{from{transform:rotate(0)}to{transform:rotate(-45deg)}}
@keyframes rot45{from{transform:rotate(0)}to{transform:rotate(45deg)}}

/* ---------- time pills: big, they're what the viewer reads ---------- */
@keyframes pillIn{0%{opacity:0;transform:translateY(34px) scale(.4);animation-timing-function:var(--out)}
  55%{opacity:1;transform:translateY(-6px) scale(1.08,.94);animation-timing-function:var(--io)}
  80%{transform:translateY(1px) scale(.98,1.02)}100%{opacity:1;transform:none}}
@keyframes pillPulse{0%{transform:none;animation-timing-function:var(--out)}40%{transform:scale(1.1);animation-timing-function:var(--io)}100%{transform:none}}

.rip{opacity:0;fill:none;stroke:#1f5fff;stroke-width:4;animation:ripple 1.4s cubic-bezier(.2,.6,.3,1) forwards}
@keyframes ripple{0%{transform:scale(1);opacity:.8}100%{transform:scale(2.6);opacity:0}}

.txtout{animation:txtout .2s var(--io) 5.3s forwards}
@keyframes txtout{to{opacity:0;filter:blur(6px)}}
.br{position:absolute;width:44px;height:44px;border-color:#2a2d33;border-style:solid;border-width:0;z-index:55}

/* ---- text motion, measured from the reference ----
   words: rise 36px, 0.45s on --txt; blur/opacity clear first (0.2s, --rev).
   key word: 0.75s on --key, no overshoot/squash; then .kw breathes +2.5% through the hold. */
:root{--txt:cubic-bezier(.2,.3,0,.8);--key:cubic-bezier(.3,.65,.45,.85);--rev:cubic-bezier(.2,.7,.3,1)}
@keyframes rise36{from{transform:translateY(36px)}to{transform:none}}
@keyframes reveal{from{opacity:0;filter:blur(16px)}to{opacity:1;filter:blur(0)}}
@keyframes breathe{from{transform:scale(1)}to{transform:scale(1.025)}}
.kw{display:inline-block;transform-origin:50% 60%;animation:breathe var(--bl) var(--io) var(--bd) both}
</style></head><body>
<svg width="0" height="0" style="position:absolute">
  <defs>
    <g id="cap" fill="#fff"><path d="M-22 -4 L0 -15 L22 -4 L0 7 Z"/><path d="M-12 1 v10 q12 8 24 0 v-10 l-12 6 z"/><rect x="17" y="-3" width="3" height="14" rx="1.5"/></g>
    <g id="uni" fill="#fff"><path d="M-20 -7 L0 -18 L20 -7 Z"/><rect x="-15" y="-4" width="5" height="15"/><rect x="-5" y="-4" width="5" height="15"/><rect x="5" y="-4" width="5" height="15"/><rect x="-20" y="12" width="40" height="5" rx="1"/></g>
    <g id="train"><rect x="-14" y="-19" width="28" height="29" rx="7" fill="#fff"/><rect x="-9" y="-14" width="18" height="9" rx="2" fill="#16181d"/>
      <circle cx="-7" cy="4" r="2.6" fill="#16181d"/><circle cx="7" cy="4" r="2.6" fill="#16181d"/><path d="M-9 12 L-15 19 M9 12 L15 19" stroke="#fff" stroke-width="3.5" stroke-linecap="round"/></g>
  </defs>
</svg>

<div id="cam"><div id="follow"><div id="drift">

  <div id="sceneA">
    <div class="abs" style="top:270px;left:0;width:100%;text-align:center;white-space:nowrap;font-size:60px">
      <span class="lite">sabse beautiful</span> <span class="kw" style="animation:none;transform:scale(1.025)"><span class="key" style="font-size:130px;display:inline-block">balcony</span></span></div>
    <div class="abs card" style="left:170px;top:480px;width:740px;height:925px">
      <div style="position:absolute;inset:-6px;background:url(assets/balcony.jpg) center/cover;filter:blur(1.6px) saturate(.9)"></div>
      <svg class="abs" style="left:0;top:0" width="740" height="925"><g stroke="#fff" stroke-width="5"><line x1="150" y1="640" x2="590" y2="640"/><line x1="150" y1="620" x2="150" y2="660"/><line x1="590" y1="620" x2="590" y2="660"/></g></svg>
    </div>
  </div>

  <div class="abs txtout" style="top:270px;left:0;width:100%;text-align:center;white-space:nowrap;font-size:60px">
    <span class="lite w1">sab</span> <span class="lite w2">kuch</span> <span class="kw" style="--bd:1.54s;--bl:3.7s"><span class="key paas" style="font-size:150px">paas</span></span></div>

  <svg class="abs" style="left:0;top:440px" width="1080" height="1000" viewBox="0 0 1080 1000">
    <circle class="rip" style="animation-delay:2.9s" cx="540" cy="520" r="120"/>
    <circle class="rip" style="animation-delay:4.4s" cx="540" cy="520" r="120"/>
    <circle class="ring r2" pathLength="1" cx="540" cy="520" r="350"/>
    <circle class="ring r1" pathLength="1" cx="540" cy="520" r="205"/>

    <g class="txtout">
    <!-- inner ring: school (left) / college (right), start at top -->
    <g class="orbit ride" style="animation-name:rot-45;animation-delay:1.15s">
      <g style="animation:dotPop .4s linear 1.1s both, pulse .5s linear 3.1s forwards">
        <circle cx="540" cy="315" r="36" fill="#16181d"/>
        <g transform="translate(540 315)"><g class="ride" style="animation-name:rot45;animation-delay:1.15s"><use href="#cap"/></g></g></g></g>
    <g class="orbit ride" style="animation-name:rot45;animation-delay:1.2s">
      <g style="animation:dotPop .4s linear 1.15s both, pulse .5s linear 3.17s forwards">
        <circle cx="540" cy="315" r="36" fill="#16181d"/>
        <g transform="translate(540 315)"><g class="ride" style="animation-name:rot-45;animation-delay:1.2s"><use href="#uni"/></g></g></g></g>
    <!-- outer ring: Mira Road (left) / Bhayandar (right) stations, start at bottom -->
    <g class="orbit ride" style="animation-name:rot45;animation-delay:2.0s">
      <g style="animation:dotPop .4s linear 1.95s both, pulse .5s linear 3.9s forwards">
        <circle cx="540" cy="870" r="38" fill="#16181d"/>
        <g transform="translate(540 870)"><g class="ride" style="animation-name:rot-45;animation-delay:2.0s"><use href="#train"/></g></g></g></g>
    <g class="orbit ride" style="animation-name:rot-45;animation-delay:2.05s">
      <g style="animation:dotPop .4s linear 2.0s both, pulse .5s linear 3.97s forwards">
        <circle cx="540" cy="870" r="38" fill="#16181d"/>
        <g transform="translate(540 870)"><g class="ride" style="animation-name:rot45;animation-delay:2.05s"><use href="#train"/></g></g></g></g>

    <g style="animation:pillIn .5s linear 1.5s both, pillPulse .5s linear 3.1s forwards">
      <rect x="305" y="50" width="470" height="90" rx="45" fill="#1f5fff"/>
      <text x="540" y="113" text-anchor="middle" font-family="Inter Display" font-size="54" font-weight="800" fill="#fff" letter-spacing="-2">2–5 min walk</text></g>
    <g style="animation:pillIn .5s linear 2.45s both, pillPulse .5s linear 3.9s forwards">
      <rect x="370" y="895" width="340" height="90" rx="45" fill="#16181d"/>
      <text x="540" y="958" text-anchor="middle" font-family="Inter Display" font-size="54" font-weight="800" fill="#fff" letter-spacing="-2">10–12 min</text></g>
    </g>
  </svg>

  <div class="flyx"><div class="flyy"><div class="disc">
    <div class="ft">3 ft</div>
    <div class="tw tw1"></div><div class="tw tw2"></div>
  </div></div></div>
</div></div></div>

<div class="br" style="left:90px;top:230px;border-left-width:4px;border-top-width:4px"></div>
<div class="br" style="left:946px;top:230px;border-right-width:4px;border-top-width:4px"></div>
<div class="br" style="left:90px;top:1396px;border-left-width:4px;border-bottom-width:4px"></div>
<div class="br" style="left:946px;top:1396px;border-right-width:4px;border-bottom-width:4px"></div>
<div class="grain"></div>
</body></html>
