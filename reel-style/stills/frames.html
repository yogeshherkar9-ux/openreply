<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../approved/assets/fonts.css">
<!-- Safe zones (1080x1920): text only between y 220–1440 and x 80–940.
     Bottom 480px = IG caption/username + subtitles, right 140px = IG buttons. -->
<style>
:root{--blue:#1f5fff;--cyan:#22b8f0;--ink:#16181d;--mute:#6b7180}
*{margin:0;box-sizing:border-box}
body{background:#888;font-family:"Inter Display",Inter,sans-serif;color:var(--ink)}
.f{width:1080px;height:1920px;position:relative;overflow:hidden;margin-bottom:20px;
  background:radial-gradient(ellipse at 50% 40%,#f4f6f9 0%,#e6e9ee 60%,#cfd4dc 100%)}
.f::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:50;
  background-image:radial-gradient(rgba(0,0,0,.09) 1px,transparent 1.5px);background-size:5px 5px;mix-blend-mode:multiply}
.f.dark{background:radial-gradient(ellipse at 50% 35%,#1d2129 0%,#0b0c0f 55%,#000 100%);color:#f2f3f5}
.f.dark::after{background-image:radial-gradient(rgba(255,255,255,.05) 1px,transparent 1.5px);mix-blend-mode:screen}
.abs{position:absolute}
.c{left:0;width:100%;text-align:center}
.lite{font-weight:300;letter-spacing:-.03em;color:#4a4f59}
.key{font-weight:800;letter-spacing:-.06em;
  background:linear-gradient(90deg,var(--blue),var(--cyan));-webkit-background-clip:text;color:transparent}
.card{border-radius:40px;overflow:hidden;box-shadow:0 50px 90px rgba(20,30,60,.25),0 8px 20px rgba(20,30,60,.1)}
.tag{display:inline-block;padding:14px 26px;border-radius:999px;font-weight:700;font-size:34px;letter-spacing:-.03em}
</style></head><body>

<!-- 1 · HOOK — attention: TOP centre, over the empty sky. Image fills the rest, footer stays clean. -->
<section class="f" id="f1">
  <div class="abs" style="inset:-40px;background:url(towers.jpg) center 70%/cover;filter:blur(7px) saturate(.75) brightness(1.04)"></div>
  <div class="abs" style="inset:0;background:linear-gradient(#eef1f5 0%,rgba(238,241,245,.9) 30%,rgba(238,241,245,0) 55%)"></div>
  <div class="abs c lite" style="top:300px;font-size:64px">ready to move ghar</div>
  <div class="abs c key" style="top:390px;font-size:215px;line-height:1">1 &amp; 2 BHK</div>
  <div class="abs c" style="top:660px;font-size:46px;letter-spacing:-.03em">
    <span class="lite">pool · club house ·</span> <b style="color:var(--blue)">creek view</b></div>
</section>

<!-- 2 · BALCONY — attention: CENTRE card. One line above it, nothing below. -->
<section class="f" id="f2">
  <div class="abs c" style="top:270px;white-space:nowrap">
    <span class="lite" style="font-size:60px">sabse beautiful</span>
    <span class="key" style="font-size:130px">balcony</span></div>
  <div class="abs card" style="left:170px;top:480px;width:740px;height:925px">
    <div style="position:absolute;inset:-6px;background:url(balcony.jpg) center/cover;filter:blur(1.6px) saturate(.9)"></div>
    <!-- 3 ft dimension across the balcony depth -->
    <svg class="abs" style="left:0;top:0" width="740" height="925">
      <g stroke="#fff" stroke-width="5" fill="none"><line x1="180" y1="640" x2="560" y2="640"/><line x1="180" y1="620" x2="180" y2="660"/><line x1="560" y1="620" x2="560" y2="660"/></g>
    </svg>
    <div class="abs tag" style="left:290px;top:600px;background:var(--blue);color:#fff;font-size:44px">3 ft</div>
    <div class="abs tag" style="left:30px;top:30px;background:rgba(255,255,255,.92);font-weight:600"><span style="color:#4a4f59">khadi + </span><span style="color:var(--blue)">mountain view</span></div>
  </div>
</section>

<!-- 3 · LOCATION — attention: CENTRE orbit. Headline top, footer clean. -->
<section class="f" id="f3">
  <div class="abs c" style="top:270px;white-space:nowrap">
    <span class="lite" style="font-size:60px">sab kuch</span>
    <span class="key" style="font-size:150px">paas</span></div>
  <svg class="abs" style="left:0;top:520px" width="1080" height="920" viewBox="0 0 1080 920" font-family="Inter Display">
    <circle cx="540" cy="450" r="400" fill="none" stroke="#2a2d33" stroke-width="3"/>
    <circle cx="540" cy="450" r="240" fill="none" stroke="#2a2d33" stroke-width="3"/>
    <circle cx="540" cy="450" r="120" fill="#1f5fff"/>
    <g fill="#fff"><rect x="505" y="385" width="30" height="120" rx="4"/><rect x="547" y="365" width="30" height="140" rx="4"/></g>
    <text x="540" y="540" fill="#fff" font-size="24" font-weight="600" text-anchor="middle" opacity=".9">2 × 36 floors</text>
    <!-- inner ring: school / college -->
    <circle cx="370" cy="280" r="24" fill="#16181d"/><circle cx="710" cy="280" r="24" fill="#16181d"/>
    <!-- outer ring: stations -->
    <circle cx="257" cy="733" r="28" fill="#16181d"/><circle cx="823" cy="733" r="28" fill="#16181d"/>
    <g font-weight="500" letter-spacing="-1" fill="#4a4f59" font-size="34">
      <text x="332" y="292" text-anchor="end">school</text>
      <text x="748" y="292">college</text>
      <rect x="142" y="768" width="230" height="52" rx="26" fill="#fff"/><text x="257" y="805" text-anchor="middle" font-size="30">Mira Road stn</text>
      <rect x="703" y="768" width="240" height="52" rx="26" fill="#fff"/><text x="823" y="805" text-anchor="middle" font-size="30">Bhayandar stn</text>
    </g>
    <rect x="390" y="185" width="300" height="56" rx="28" fill="#1f5fff"/>
    <text x="540" y="225" text-anchor="middle" font-size="32" font-weight="800" fill="#fff" letter-spacing="-1">2–5 min walk</text>
    <rect x="430" y="822" width="220" height="56" rx="28" fill="#16181d"/>
    <text x="540" y="862" text-anchor="middle" font-size="32" font-weight="800" fill="#fff" letter-spacing="-1">10–12 min</text>
  </svg>
</section>

<!-- 4 · PRICING — attention: MIDDLE price line; bars support it; footer clean. -->
<section class="f dark" id="f4">
  <div class="abs c" style="top:330px;font-weight:300;font-size:54px;letter-spacing:-.03em;color:#9aa0ab">2 BHK pricing</div>
  <div class="abs c" style="top:410px;white-space:nowrap;line-height:1">
    <span style="font-weight:300;font-size:118px;letter-spacing:-.05em;color:#c9ccd3">₹1.10 –</span>
    <span class="key" style="font-size:150px">1.37 Cr</span></div>
  <div class="abs c" style="top:600px;font-weight:400;font-size:34px;letter-spacing:-.02em;color:#7d828d">+ stamp duty · registration · GST alag se</div>
  <div class="abs" style="left:170px;top:760px;width:740px;height:520px;display:flex;align-items:flex-end;gap:34px">
    <div style="flex:1;height:100%;background:linear-gradient(#cfe8ff,#1f5fff 70%,#0d2a7a)"></div>
    <div style="flex:1;height:98.8%;background:#ffffff14;border:2px solid #ffffff30"></div>
    <div style="flex:1;height:95%;background:#ffffff14;border:2px solid #ffffff30"></div>
    <div style="flex:1;height:93.9%;background:#ffffff14;border:2px solid #ffffff30"></div>
    <div style="flex:1;height:83.8%;background:#ffffff14;border:2px solid #ffffff30"></div>
  </div>
  <div class="abs" style="left:170px;top:1300px;width:740px;display:flex;gap:34px;text-align:center;font-weight:600;font-size:36px;letter-spacing:-.03em">
    <div style="flex:1;color:#6fa0ff">686</div><div style="flex:1">678</div><div style="flex:1">652</div><div style="flex:1">644</div><div style="flex:1">575</div>
  </div>
  <div class="abs c" style="top:1360px;font-size:24px;color:#7d828d;letter-spacing:.2em">CARPET AREA · SQ FT</div>
</section>
</body></html>
